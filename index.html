<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FaultyTerminal × 音乐波形</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #04060a;
    color: #a8ffb8;
    font-family: "Courier New", Consolas, monospace;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .controls {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 16px; background: #0a0f14;
    border-top: 1px solid #1d2b23; font-size: 13px;
  }
  button {
    background: #0f1a12; color: #a8ffb8; border: 1px solid #2f5a3c;
    padding: 6px 14px; cursor: pointer; font-family: inherit; font-size: 13px;
  }
  button:hover { background: #16241a; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #fileName {
    max-width: 220px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: #8fb99a;
  }
  label { display: flex; align-items: center; gap: 6px; color: #8fb99a; }
  input[type=checkbox] { accent-color: #57e389; }
  /* 弹性滑杆（参考 new.txt 的 ElasticSlider，图标省略） */
  .slider-wrap {
    display: flex; align-items: center; justify-content: center;
    opacity: .7; transition: transform .25s, opacity .25s;
  }
  .slider-wrap:hover { opacity: 1; }
  #progressWrap { flex: 1; min-width: 120px; max-width: 45vw; }
  #sensWrap { width: 110px; }
  #sensWrap:hover { transform: scale(1.15); }
  .slider-root {
    position: relative; flex-grow: 1; padding: 10px 0;
    cursor: grab; touch-action: none; user-select: none;
  }
  .slider-root:active { cursor: grabbing; }
  .track-wrapper { display: flex; flex-grow: 1; transform: scaleX(1) scaleY(1); }
  .slider-track {
    position: relative; width: 100%; height: 6px;
    background: rgba(128, 128, 128, .35); border-radius: 999px; overflow: hidden;
    transform: scaleY(1);
    transition: transform .25s;
  }
  /* 用 transform 而非 height 实现变粗：不改变布局尺寸，避免功能栏抖动 */
  .slider-wrap:hover .slider-track { transform: scaleY(2); }
  .slider-range {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: #57e389; box-shadow: 0 0 8px #57e389; border-radius: 999px;
  }
  .slider-thumb {
    position: absolute; top: 50%; left: 0%;
    width: 14px; height: 14px; margin-top: -7px;
    border-radius: 50%; background: #57e389;
    box-shadow: 0 0 8px #57e389;
    transform: translateX(-50%) scale(1);
    transition: transform .25s;
    pointer-events: none;
  }
  .slider-wrap:hover .slider-thumb { transform: translateX(-50%) scale(1.35); }
  .meter {
    width: 90px; height: 10px; border: 1px solid #2f5a3c; position: relative;
  }
  #meterFill {
    height: 100%; width: 0%; background: #57e389;
    box-shadow: 0 0 8px #57e389; transition: none;
  }
  #btnFull { margin-left: auto; }
  :fullscreen .controls { display: none; }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="gl"></canvas>
  </div>
  <div class="controls">
    <button id="btnUpload">上传音频</button>
    <input type="file" id="fileInput" accept="audio/*" hidden />
    <span id="fileName">未选择文件</span>
    <button id="btnPlay" disabled>播放</button>
    <div class="slider-wrap" id="progressWrap">
      <div class="slider-root" id="progressBar" title="点击/拖动调节播放进度">
        <div class="track-wrapper" id="progressTrackWrap">
          <div class="slider-track"><div class="slider-range" id="progressFill"></div></div>
        </div>
        <div class="slider-thumb" id="progressThumb"></div>
      </div>
    </div>
    <span id="timeDisplay">--:-- / --:--</span>
    <label><input type="checkbox" id="loopChk" checked />循环</label>
    <label>灵敏度</label>
    <div class="slider-wrap" id="sensWrap">
      <div class="slider-root" id="sensRoot" title="灵敏度 0.2 ~ 3">
        <div class="track-wrapper" id="sensTrackWrap">
          <div class="slider-track"><div class="slider-range" id="sensRange"></div></div>
        </div>
        <div class="slider-thumb" id="sensThumb"></div>
      </div>
    </div>
    <div class="meter" title="音量电平"><div id="meterFill"></div></div>
    <button id="btnFull" title="快捷键 Esc 进入/退出全屏">全屏</button>
  </div>

<script>
// ==================== WebGL ====================
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias: false });
gl.clearColor(0, 0, 0, 1);

const VERT = `
attribute vec2 aPos;
attribute vec2 aUv;
varying vec2 vUv;
void main() { vUv = aUv; gl_Position = vec4(aPos, 0.0, 1.0); }
`;

// 由 FaultyTerminal 原版 shader 改造：删除鼠标扰动，新增 uAudioLevel / uShowPattern
const FRAG = `
precision mediump float;

varying vec2 vUv;

uniform float iTime;
uniform vec3  iResolution;
uniform float uScale;
uniform vec2  uGridMul;
uniform float uDigitSize;
uniform float uScanlineIntensity;
uniform float uGlitchAmount;
uniform float uFlickerAmount;
uniform float uNoiseAmp;
uniform float uChromaticAberration;
uniform float uDither;
uniform float uCurvature;
uniform vec3  uTint;
uniform float uAudioLevel;
uniform float uShowPattern;
uniform float uGridFade;
uniform float uBrightness;

float time;

float hash21(vec2 p){
  p = fract(p * 234.56);
  p += dot(p, p + 34.56);
  return fract(p.x * p.y);
}

// 平滑随机场：相邻格子取值连续相关 → 阈值分割后自然形成不规则粘连的团块
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

float noise(vec2 p)
{
  return sin(p.x * 10.0) * sin(p.y * (3.0 + sin(time * 0.090909))) + 0.2;
}

mat2 rotate(float angle)
{
  float c = cos(angle);
  float s = sin(angle);
  return mat2(c, -s, s, c);
}

float fbm(vec2 p)
{
  p *= 1.1;
  float f = 0.0;
  float amp = 0.5 * uNoiseAmp;

  mat2 modify0 = rotate(time * 0.02);
  f += amp * noise(p);
  p = modify0 * p * 2.0;
  amp *= 0.454545;

  mat2 modify1 = rotate(time * 0.02);
  f += amp * noise(p);
  p = modify1 * p * 2.0;
  amp *= 0.454545;

  mat2 modify2 = rotate(time * 0.08);
  f += amp * noise(p);

  return f;
}

float pattern(vec2 p, out vec2 q, out vec2 r) {
  vec2 offset1 = vec2(1.0);
  vec2 offset0 = vec2(0.0);
  mat2 rot01 = rotate(0.1 * time);
  mat2 rot1 = rotate(0.1);

  q = vec2(fbm(p + offset1), fbm(rot01 * p + offset1));
  r = vec2(fbm(rot1 * q + offset0), fbm(q + offset0));
  return fbm(p + r);
}

float digit(vec2 p){
    vec2 grid = uGridMul * 15.0;
    vec2 s = floor(p * grid) / grid;
    p = p * grid;
    vec2 q, r;
    float patternVal = pattern(s * 0.1, q, r);
    float intensity = (patternVal * 1.3 - 0.03) * 0.6; // 网格亮度 ×0.6
    intensity *= uShowPattern * uGridFade;             // 图案开关 × 播放时渐隐

    // ===== 音频驱动：随机格子的数量 + 撑满程度，都随 uAudioLevel 线性变化 =====
    // 每格一个固定随机值，叠加周期性"洗牌"（约 1.7 秒换一批），亮点跟着音乐持续跳动
    float cellRnd = hash21(s * 3.7 + 17.0 + floor(iTime * 0.6) * 7.13);
    // 点亮概率 = uAudioLevel → 音量越高，随机亮起的格子越多
    float lit = step(1.0 - uAudioLevel, cellRnd);
    // 门控：音频像素只出现在流动团块上（用原始 pattern 值判断，不受亮度/渐隐影响）
    float blob = smoothstep(0.2, 0.45, patternVal);
    // 中心因子：团块边缘 0 → 中心 1，形成「边缘敏感、中心稳定」的空间梯度
    float core = smoothstep(0.3, 0.5, patternVal);
    float activity = smoothstep(0.02, 0.08, uAudioLevel);        // 音乐在响 → 1，不响 → 0
    // 中心核心：平滑随机场代替掷骰子 → 5×5 大格子粘连成不规则「小团块」
    // 场值高于阈值(1-L)的格子涨满 5×5；阈值边缘落差平滑衰减，
    // 外围自然形成 菱形(13) → 3×3(9) → 更小 的过渡带
    float thr = 1.0 - uAudioLevel;
    float clumpField = vnoise(s * grid / 3.5 + iTime * vec2(0.07, 0.05));
    float grow = smoothstep(thr - 0.4, thr, clumpField);
    intensity += core * activity * (grow * 0.6);   // 0.6 = 5×5 全亮
    // 外围：点亮概率 = L；最大尺寸从边缘到中心渐变（边缘最多 3×3，越靠中心越大）
    float maxSize = mix(0.225, 0.6, core);
    float size = 0.12 + (maxSize - 0.12) * uAudioLevel;          // 音量低时都是中心小像素
    intensity += lit * size * blob * (1.0 - core);

    p = fract(p);
    p *= uDigitSize;

    float px5 = p.x * 5.0;
    float py5 = (1.0 - p.y) * 5.0;
    float x = fract(px5);
    float y = fract(py5);

    float i = floor(py5) - 2.0;
    float j = floor(px5) - 2.0;
    float n = i * i + j * j;
    float f = n * 0.0625;

    float isOn = step(0.1, intensity - f);
    float brightness = isOn * (0.2 + y * 0.8) * (0.75 + x * 0.25);

    return step(0.0, p.x) * step(p.x, 1.0) * step(0.0, p.y) * step(p.y, 1.0) * brightness;
}

float onOff(float a, float b, float c)
{
  return step(c, sin(iTime + a * cos(iTime * b))) * uFlickerAmount;
}

float displace(vec2 look)
{
    float y = look.y - mod(iTime * 0.25, 1.0);
    float window = 1.0 / (1.0 + 50.0 * y * y);
    return sin(look.y * 20.0 + iTime) * 0.0125 * onOff(4.0, 2.0, 0.8) * (1.0 + cos(iTime * 60.0)) * window;
}

vec3 getColor(vec2 p){

    float bar = step(mod(p.y + time * 20.0, 1.0), 0.2) * 0.4 + 1.0;
    bar *= uScanlineIntensity;

    float displacement = displace(p);
    p.x += displacement;

    if (uGlitchAmount != 1.0) {
      float extra = displacement * (uGlitchAmount - 1.0);
      p.x += extra;
    }

    float middle = digit(p);

    const float off = 0.002;
    float sum = digit(p + vec2(-off, -off)) + digit(p + vec2(0.0, -off)) + digit(p + vec2(off, -off)) +
                digit(p + vec2(-off, 0.0)) + digit(p + vec2(0.0, 0.0)) + digit(p + vec2(off, 0.0)) +
                digit(p + vec2(-off, off)) + digit(p + vec2(0.0, off)) + digit(p + vec2(off, off));

    vec3 baseColor = vec3(0.9) * middle + sum * 0.1 * vec3(1.0) * bar;
    return baseColor;
}

vec2 barrel(vec2 uv){
  vec2 c = uv * 2.0 - 1.0;
  float r2 = dot(c, c);
  c *= 1.0 + uCurvature * r2;
  return c * 0.5 + 0.5;
}

void main() {
    time = iTime * 0.333333;
    vec2 uv = vUv;

    if(uCurvature != 0.0){
      uv = barrel(uv);
    }

    vec2 p = uv * uScale;
    vec3 col = getColor(p);

    if(uChromaticAberration != 0.0){
      vec2 ca = vec2(uChromaticAberration) / iResolution.xy;
      col.r = getColor(p + ca).r;
      col.b = getColor(p - ca).b;
    }

    col *= uTint;
    col *= uBrightness;

    if(uDither > 0.0){
      float rnd = hash21(gl_FragCoord.xy);
      col += (rnd - 0.5) * (uDither * 0.003922);
    }

    gl_FragColor = vec4(col, 1.0);
}
`;

function compileShader(type, src) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(sh));
  }
  return sh;
}

const prog = gl.createProgram();
gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  throw new Error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

// 全屏三角形
const vbuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vbuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
  -1, -1, 0, 0,
   3, -1, 2, 0,
  -1,  3, 0, 2
]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
const aUv  = gl.getAttribLocation(prog, 'aUv');
gl.enableVertexAttribArray(aPos);
gl.enableVertexAttribArray(aUv);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 16, 0);
gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 16, 8);

const U = {};
['iTime','iResolution','uScale','uGridMul','uDigitSize','uScanlineIntensity','uGlitchAmount',
 'uFlickerAmount','uNoiseAmp','uChromaticAberration','uDither','uCurvature','uTint',
 'uAudioLevel','uShowPattern','uGridFade','uBrightness'].forEach(n => U[n] = gl.getUniformLocation(prog, n));

// 静态参数（参考 test.txt；gridMul 加密到 [4,2]：格子长宽减半、数量 ×4）
gl.uniform1f(U.uScale, 1.5);
gl.uniform2f(U.uGridMul, 4, 2);
gl.uniform1f(U.uDigitSize, 1.2);
gl.uniform1f(U.uScanlineIntensity, 1);
gl.uniform1f(U.uGlitchAmount, 1);
gl.uniform1f(U.uFlickerAmount, 1);
gl.uniform1f(U.uNoiseAmp, 1);
gl.uniform1f(U.uChromaticAberration, 0);
gl.uniform1f(U.uDither, 0);
gl.uniform1f(U.uCurvature, 0);
gl.uniform3f(U.uTint, 1, 1, 1);
gl.uniform1f(U.uBrightness, 1);
gl.uniform1f(U.uGridFade, 1);
gl.uniform1f(U.uShowPattern, 1);   // 底层图案常开

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
  const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  gl.uniform3f(U.iResolution, w, h, w / h);
}
new ResizeObserver(resize).observe(canvas);
resize();

// ==================== 音频分析 ====================
let audioCtx = null, analyser = null, dataArray = null;
let audioBuffer = null, source = null, sourceEnded = false;
let playing = false, startedAt = 0, playOffset = 0;

const level = { current: 0, target: 0 };

// 播放过渡：点播放时网格 1 秒渐隐，音乐结束时 1 秒恢复
let gridFade = 1;
let fadeAnim = null; // { from, to, start, dur }

function startFade(to) {
  fadeAnim = { from: gridFade, to, start: performance.now(), dur: 1000 };
}

const fileInput = document.getElementById('fileInput');
const btnPlay = document.getElementById('btnPlay');

document.getElementById('btnUpload').addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    dataArray = new Uint8Array(analyser.fftSize);
    analyser.connect(audioCtx.destination);
  }
  try {
    audioBuffer = await audioCtx.decodeAudioData(await file.arrayBuffer());
  } catch (err) {
    alert('音频解码失败：' + err.message);
    return;
  }
  stopSource();
  playing = false;
  document.getElementById('fileName').textContent = file.name;
  btnPlay.disabled = false;
  updatePlayBtn();
  updateTime();
});

function stopSource() {
  if (source) {
    source.onended = null;
    try { source.stop(); } catch (e) {}
    source = null;
  }
  sourceEnded = false;
}

function createSource(offset = 0) {
  stopSource();
  source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.loop = document.getElementById('loopChk').checked;
  source.connect(analyser);
  source.onended = () => {
    sourceEnded = true;
    playing = false;
    updatePlayBtn();
    startFade(1);   // 音乐结束：网格 1 秒恢复
  };
  playOffset = offset;
  startedAt = audioCtx.currentTime;
  source.start(0, offset);
}

document.getElementById('loopChk').addEventListener('change', () => {
  if (source && !sourceEnded) source.loop = document.getElementById('loopChk').checked;
});

async function togglePlay() {
  if (!audioBuffer) return;
  if (playing) {
    await audioCtx.suspend();
    playing = false;
    startFade(1);   // 暂停：网格 1 秒恢复常态
  } else {
    if (!source || sourceEnded) createSource();
    await audioCtx.resume();
    playing = true;
    startFade(0);   // 开始播放：网格 1 秒渐隐
  }
  updatePlayBtn();
}

btnPlay.addEventListener('click', togglePlay);

function updatePlayBtn() {
  btnPlay.textContent = playing ? '暂停' : (source && !sourceEnded ? '继续' : '播放');
}

function fmt(t) {
  if (!isFinite(t) || t < 0) return '--:--';
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

// 进度条：点击/拖动跳转
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
let seeking = false;
let lastSeekAt = 0;

function seek(t) {
  if (!audioBuffer) return;
  const dur = audioBuffer.duration;
  t = Math.max(0, Math.min(t, Math.max(0, dur - 0.05)));
  const wasPlaying = playing;
  createSource(t);
  if (!wasPlaying && audioCtx.state === 'running') {
    audioCtx.suspend();   // 未播放时跳转后保持暂停
  }
  updatePlayBtn();
  updateTime();
}

// 弹性滑杆（参考 new.txt 的 ElasticSlider，原生实现，图标省略）
function decay(v, max) {
  if (max === 0) return 0;
  const entry = v / max;
  return 2 * (1 / (1 + Math.exp(-entry)) - 0.5) * max;
}

function setupElastic(root, wrap, onRatio, onStart, onEnd) {
  let dragging = false;
  let lastRatio = 0;
  const release = () => {
    if (!dragging) return;
    dragging = false;
    wrap.style.transition = 'transform .5s cubic-bezier(0.34, 1.56, 0.64, 1)';  // 弹性回弹
    wrap.style.transform = 'scaleX(1) scaleY(1)';
    onEnd && onEnd();
    onRatio(lastRatio, true);
  };
  root.addEventListener('pointerdown', e => {
    dragging = true;
    root.setPointerCapture(e.pointerId);
    wrap.style.transition = 'none';
    onStart && onStart();
    move(e);
  });
  root.addEventListener('pointermove', e => { if (dragging) move(e); });
  root.addEventListener('pointerup', release);
  root.addEventListener('pointercancel', release);
  root.addEventListener('lostpointercapture', release);

  function move(e) {
    const rect = root.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    lastRatio = ratio;
    let ov = 0;
    if (e.clientX < rect.left) {
      ov = decay(rect.left - e.clientX, 50);
      wrap.style.transformOrigin = 'right center';
    } else if (e.clientX > rect.right) {
      ov = decay(e.clientX - rect.right, 50);
      wrap.style.transformOrigin = 'left center';
    } else {
      wrap.style.transformOrigin = (e.clientX < rect.left + rect.width / 2) ? 'right center' : 'left center';
    }
    wrap.style.transform = 'scaleX(' + (1 + ov / rect.width) + ') scaleY(' + (1 - 0.2 * ov / 50) + ')';
    onRatio(ratio, false);
  }
}

// 进度条弹性滑杆
const progressThumb = document.getElementById('progressThumb');
setupElastic(
  progressBar, document.getElementById('progressTrackWrap'),
  (ratio, released) => {
    if (!audioBuffer) return;
    // 拖动时实时更新进度条外观
    progressFill.style.width = (ratio * 100).toFixed(2) + '%';
    progressThumb.style.left = (ratio * 100).toFixed(2) + '%';
    const now = performance.now();
    if (!released && now - lastSeekAt < 150) return;   // 拖动时节流，避免频繁重建音源
    lastSeekAt = now;
    seek(ratio * audioBuffer.duration);
  },
  () => { seeking = true; },
  () => { seeking = false; }
);

// 灵敏度弹性滑杆（0.2 ~ 3，步进 0.05，默认 1）
let sensValue = 1;
const sensRange = document.getElementById('sensRange');
const sensThumb = document.getElementById('sensThumb');
function setSensUI(ratio) {
  sensValue = Math.round((0.2 + ratio * 2.8) / 0.05) * 0.05;
  sensRange.style.width = (ratio * 100).toFixed(2) + '%';
  sensThumb.style.left = (ratio * 100).toFixed(2) + '%';
}
setupElastic(document.getElementById('sensRoot'), document.getElementById('sensTrackWrap'),
  (ratio, released) => { if (ratio !== null) setSensUI(ratio); }
);
setSensUI((1 - 0.2) / 2.8);

// 全屏：按钮点击或 Esc 进入；全屏时浏览器默认 Esc 退出（此时只显示动画）
const btnFull = document.getElementById('btnFull');
btnFull.addEventListener('click', () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    document.documentElement.requestFullscreen();
  }
});
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  }
});

// 空格：播放/暂停（焦点在按钮等控件上时不接管，交给控件自己的行为）
window.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  const tag = e.target.tagName;
  if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'LABEL') return;
  e.preventDefault();
  togglePlay();
});

function updateTime() {
  const dur = audioBuffer ? audioBuffer.duration : 0;
  let el = 0;
  if (source) {
    const raw = playOffset + (audioCtx.currentTime - startedAt);
    el = (source.loop && dur > 0) ? raw % dur : Math.min(raw, dur);   // 循环播放时进度回绕
  }
  document.getElementById('timeDisplay').textContent = fmt(el) + ' / ' + fmt(dur);
  if (!seeking && dur > 0) {
    progressFill.style.width = (el / dur * 100).toFixed(2) + '%';
    progressThumb.style.left = (el / dur * 100).toFixed(2) + '%';
  }
}

// ==================== 渲染循环 ====================
const meterFill = document.getElementById('meterFill');

function readAudioLevel() {
  if (analyser && playing) {
    analyser.getByteTimeDomainData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) {
      const v = (dataArray[i] - 128) / 128;
      sum += v * v;
    }
    const rms = Math.sqrt(sum / dataArray.length);
    level.target = Math.min(1, rms * sensValue * 3.5);
  } else {
    level.target = 0;
  }
  // 快攻慢放：跟得上鼓点，又不会抖得太碎
  const k = level.target > level.current ? 0.55 : 0.12;
  level.current += (level.target - level.current) * k;
  return level.current;
}

// 时间推进：未播放音乐时整体慢 0.7 倍，播放后恢复原速（平滑过渡避免跳变）
let shaderTime = 0;
let lastT = performance.now();
let speedFactor = 0.7;

function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (t - lastT) / 1000));
  lastT = t;
  const targetSpeed = playing ? 1 : 0.7;
  speedFactor += (targetSpeed - speedFactor) * 0.05;
  shaderTime += dt * speedFactor;

  if (fadeAnim) {
    const p = Math.min(1, (t - fadeAnim.start) / fadeAnim.dur);
    gridFade = fadeAnim.from + (fadeAnim.to - fadeAnim.from) * p;
    if (p >= 1) fadeAnim = null;
  }

  gl.uniform1f(U.iTime, shaderTime);
  gl.uniform1f(U.uGridFade, gridFade);
  gl.uniform1f(U.uAudioLevel, readAudioLevel());
  meterFill.style.width = (level.current * 100).toFixed(1) + '%';
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  updateTime();
}
requestAnimationFrame(frame);
</script>
</body>
